apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentdesk
spec:
  rules:
    - host: agentdesk.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentdesk
                port:
                  number: 80
