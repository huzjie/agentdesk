[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk"
version = "1.0.0"
description = "Enterprise Digital Workforce Operations Platform: turn LLMs into managed digital employees."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "huzjie" }]
keywords = ["ai", "agent", "digital-workforce", "computer-use", "skills", "llm", "agentops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=7.0"]
gui = ["pyautogui>=0.9.54"]

[project.scripts]
agentdesk = "agentdesk.cli.main:main"

[tool.setuptools.packages.find]
include = ["agentdesk*"]
